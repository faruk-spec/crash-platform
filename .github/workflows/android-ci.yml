name: Automated Android Build & Cloud Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "### ❌ Android Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "(e: |ERROR|FAILURE|FAILED|error:|Exception)" -B 2 -A 10 /tmp/gradle_build.log | head -n 120 >> $GITHUB_STEP_SUMMARY || tail -n 80 /tmp/gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $GRADLE_EXIT
          fi

      - name: Dump and Commit Error Log On Failure
        if: failure()
        run: |
          echo "=== CAPTURING GRADLE FAILURE ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            echo "=== KOTLIN COMPILER ERRORS ==="
            grep -E "e: " /tmp/gradle_build.log || true
            echo "=== BUILD LOG TAIL ==="
            tail -n 120 /tmp/gradle_build.log
          } > build_failure.txt
          git add build_failure.txt
          git commit -m "chore(debug): capture build failure log [skip ci]" || true
          git push origin main || true

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: /tmp/gradle_build.log
          if-no-files-found: ignore

      - name: Calculate APK Checksum
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -exec sha256sum {} +

      - name: Upload APK Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: crash-predictor-app
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases (On Version Tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
